<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manjeet Gupta Resume</title>
  <style>
    body {
      margin: 0;
      background: #2b2b2b;
      font-family: Arial, sans-serif;
    }

    .top-bar {
      height: 60px;
      background: #1f1f1f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .top-bar h2 {
      font-size: 18px;
      margin: 0;
    }

    .actions a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 15px;
      background: #ffffff15;
      padding: 8px 14px;
      border-radius: 6px;
    }

    .actions a:hover {
      background: #ffffff30;
    }

    .pdf-container {
      width: 100%;
      height: calc(100vh - 60px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #2b2b2b;
    }

    @media (max-width: 600px) {
      .top-bar {
        height: auto;
        padding: 12px;
        flex-direction: column;
        gap: 10px;
      }

      .pdf-container {
        height: calc(100vh - 95px);
      }

      .actions a {
        margin: 0 6px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>Manjeet Gupta Resume</h2>

    <div class="actions">
      <a href="resume.pdf" target="_blank">Open</a>
      <a href="resume.pdf" download>Download</a>
    </div>
  </div>

  <div class="pdf-container">
    <iframe src="resume.pdf"></iframe>
  </div>

</body>
</html>
